# Sirve el repo completo, una plantilla por carpeta

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos internos del repo: no se sirven.
    location ~ ^/(\.git|\.trash|reference|utils)/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
